config_type: simple_batch
job_parameters:
  p: mit_normal_gpu,mit_preemptable,pi_donti_gpu
  exclude: node5101
  requeue: __novalue__
  body: "source ~/.bashrc\nconda activate pfdelta2\nexec __launch__"
  mem: 64G
  gres: gpu:l40s:1
  output: canos_hyperparam_branch_perturbation_%j.out
  signal: USR1@90
  time: "05:59:00"
# From-scratch task 1.3 training (case500), identical in every other respect
# to canos_task_1_3.yaml (same trainer/architecture sweep/loss/lr schedule),
# but the training data now gets branch_perturbation_sigma: 0.05 -- every
# __getitem__ call multiplicatively perturbs each branch's physical
# parameters (resistance/reactance/shunt admittance, not tap ratio/phase
# shift) by independent noise centered at 1 with std 0.05, redrawn fresh
# every epoch (see core.datasets.dataset_utils.branch_perturbation_transform
# / PFDeltaDataset). Meant as a robustness augmentation -- does training
# against a slightly different grid every step make the model less
# sensitive to the exact impedance values it saw, e.g. for topology
# transfer to other cases (PFDelta task 3.1) later on.
#
# Deliberately NOT applied to any val dataset below -- val_loss compares
# the model's prediction against ground truth solved for the ORIGINAL
# (unperturbed) grid, so perturbing val inputs would just make the labels
# wrong rather than testing anything meaningful.
#
# sigma is a real config param now, not hardcoded -- to sweep it instead of
# using this one fixed value, replace 0.05 below with e.g.
# _manual_list(0.0, 0.05, 0.1 | 0.0, 0.05, 0.1) (add %branch_perturbation_
# sigma to run_name too) the same way hidden_dim/k_steps/lr are swept.
dataset:
  datasets:
  - add_bus_type: true
    case_name: case500
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: train
    task: 1.3
    branch_perturbation_sigma: 0.05
  - add_bus_type: true
    case_name: case500
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
  - add_bus_type: true
    case_name: case14
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
  - add_bus_type: true
    case_name: case30
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
  - add_bus_type: true
    case_name: case57
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
  - add_bus_type: true
    case_name: case118
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
functional:
  checkpoint: True
  run_location: canos_task_1_3_branch_perturbation
  run_name: canos_k_steps%k_steps_hd%hidden_dim_lr%lr_sigma0.05
  is_debug: false
  seed: 11
  cpu: false
  trainer_name: gnn_trainer
model:
  dataset: _include_
  hidden_dim: _manual_list(128, 256 | 128, 256)
  include_sent_messages: true
  k_steps: _manual_list(15, 20 | 15, 20)
  name: canos_pf
optim:
  lr_scheduler:
    milestones:
    - 5
    name: SequentialLR
    schedulers:
    - end_factor: 1
      name: LinearLR
      start_factor: 0.01
    - gamma: 0.9
      name: StepLR
      step_size: 4
  optimizer:
    lr: _manual_list(0.0005, 0.001 | 5e-4, 1e-3)
    name: Adam
    weight_decay: 0.0
  train_params:
    batch_size: 64
    epochs: 200
    train_loss:
    - model: CANOS
      name: universal_power_balance
    - lamb: 0.1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
  val_params:
    batch_size: 64
    early_stop:
      decrease_by: 0.01
      decrease_for: 20
      needs_best_every: 30
    report_every: 2
    val_loss:
    - model: CANOS
      name: universal_power_balance
    - lamb: 0.1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
