# Consistency transfer test: evaluate an ALREADY-TRAINED, FROZEN model's
# self-consistency (SubproblemConsistencyLoss) across every combination of
# (source case, subgraph size band) below -- no further training, no
# gradient steps, no optimizer/scheduler/checkpoint machinery at all (see
# scripts/evaluate_consistency_transfer.py, which reads this directly --
# NOT a simple_batch/SLURM sweep config like the training ones).
#
# Answers: is self-consistency a property of the specific (case, size) a
# model was trained/tuned on, or something more fundamental about the
# model itself? E.g. does a model that's highly self-consistent on case500
# cut to 3-7-bus subgraphs stay just as consistent on case118 cut to
# 24-36-bus subgraphs? The model is structurally case-agnostic (dataset is
# only used at construction time to infer feature dimensions and stamp a
# cosmetic "casename" into outputs -- see CANOS_PF.__init__ -- never used
# for computation; per-case normalization happens entirely at the dataset
# level before data reaches the model), so evaluating a case500-trained
# model on case118 data is exactly the same code path as case500 data.

# Path to the training run's OWN DIRECTORY (not model.pt itself -- this
# needs to find BOTH <source_run>/config.yaml and <source_run>/model.pt
# inside it). Used three ways, each independently overridable below if you
# don't want it doing double (or triple) duty:
#   1. Default location to load weights from (<source_run>/model.pt) --
#      override with model_path if you want to point at a bare .pt file
#      that isn't sitting in a run directory at all.
#   2. Default source for hidden_dim/k_steps/include_sent_messages/name,
#      read from <source_run>/config.yaml's own model: block -- override
#      by filling in model: below yourself; if you specify ALL FOUR
#      there, source_run's config.yaml is never read for this at all, so
#      you don't need it to exist (or even need source_run set) as long
#      as model_path/output_dir are both given explicitly too.
#   3. Default place to write consistency_transfer_eval.json/.png --
#      override with output_dir.
source_run: runs/canos_task_3_1_joint_train_0828_tinysg/canos_sgband_5_w_sg_cons1e-2_w_sg_pbl10_task_3_1_joint_0828_tinysg_6_260829_014138
# Uncomment to bypass source_run's config.yaml for the architecture
# entirely (e.g. if you only have a bare model_path, or its config.yaml
# is missing/wrong) -- fill in whichever of these source_run's own
# config.yaml shouldn't be trusted for; any left out still get read from
# there as normal.
# model:
#   name: canos_pf
#   hidden_dim: 256
#   k_steps: 15
#   include_sent_messages: true

# Uncomment to load weights from somewhere other than <source_run>/model.pt.
# model_path: runs/canos_task_3_1_joint_train/<run_name_here>/model.pt

# Uncomment to save results somewhere other than source_run itself.
# output_dir: runs/canos_task_3_1_joint_train/<run_name_here>

# Shared across every case tested -- matching how the source run's own
# dataset entries were configured (see its config.yaml's dataset.datasets).
root_dir: /orcd/pool/005/donti_shared/pfdelta_data
task: 1.3
dataset_name: pfdeltaCANOS
model_dataset_name: CANOS
add_bus_type: true
split: val  # which split of EACH case below to evaluate on

# Every case here gets tested against every size band below -- a full
# cross product, cases x size_bands combinations, each reported as its own
# matrix cell.
cases:
  - case14
  - case30
  - case57
  - case118
  - case500

size_bands:
  - name: 5
    min_size: 3
    max_size: 7
  - name: 14
    min_size: 10
    max_size: 18
  - name: 30
    min_size: 24
    max_size: 36
  - name: 57
    min_size: 49
    max_size: 65
  - name: 118
    min_size: 110
    max_size: 126

batch_size: 128
subgraphs_per_sample: 4
seed: 11
detach_teacher: true
# Optional -- same sampling_strategies schema as a training config's
# subproblem_consistency entry (see core.utils.create_subproblem.
# SAMPLING_STRATEGIES). Omit (or leave null) for plain BFS.
sampling_strategies: null

# "cuda" if available, else "cpu" -- override if you want to force one.
device: null
