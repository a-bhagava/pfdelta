config_type: simple_batch
job_parameters:
  # Same routing as canos_task_3_1_finetune.yaml -- any of these partitions,
  # 1 h200. A full from-scratch run (200 epochs, see optim.train_params.
  # epochs below) needs more requeue cycles than an 80-epoch finetune under
  # this same 6h per-allocation limit, but requeue/USR1 checkpointing below
  # already handles that.
  p: mit_normal_gpu,mit_preemptable,pi_donti_gpu
  gres: gpu:h200:1
  requeue: __novalue__
  body: "source ~/.bashrc\nconda activate pfdelta2\nexec __launch__"
  mem: 64G
  output: canos_hyperparam_joint_%j.out
  signal: USR1@90
  time: "05:59:00"
# Subgraph-consistency augmentation baked in from the START of training
# (PFDelta task 3.1), rather than as a separate finetuning stage applied to
# an already-converged checkpoint -- contrast with canos_task_3_1_finetune.
# yaml, which warm-starts from a plain canos_task_1_3.yaml run (case500
# only, no consistency term) and finetunes briefly (80 epochs, small lr, no
# warmup) with the consistency/subgraph-PBL terms added on top.
#
# Here there's no model.pretrained_path -- GNNTrainer's normal (random)
# initialization is used, and the SAME combined objective (universal_power_
# balance + w2*consistency + w3*subgraph-PBL) is optimized for the entire
# training run, on the same case500 train split canos_task_1_3.yaml uses.
# epochs/lr/lr_scheduler/early_stop below are copied from canos_task_1_3.
# yaml's own from-scratch regime (a short finetune-style schedule -- low
# fixed lr, no warmup -- would badly undertrain a randomly-initialized
# model), not from the finetune config's short/low-lr settings.
#
# Everything else (loss structure, sgband/consw/pblw sweeps, val datasets,
# consistency_val_indices, subgraphs_per_sample, trainer) is unchanged from
# canos_task_3_1_finetune.yaml, so results between the two configs are
# directly comparable: same architecture (hidden_dim/k_steps fixed to match
# the checkpoint the finetune config warm-starts from), same augmentation,
# same size bands and loss weights swept the same way.
dataset:
  datasets:
  - add_bus_type: true
    case_name: case500  # the only source of training data
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: train
    task: 1.3
  - add_bus_type: true
    case_name: case14
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
  - add_bus_type: true
    case_name: case30
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
  - add_bus_type: true
    case_name: case57
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
  - add_bus_type: true
    case_name: case118
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
  - add_bus_type: true
    case_name: case500
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
functional:
  checkpoint: True  # matches canos_task_1_3.yaml -- worth it over 200 epochs
  run_location: canos_task_3_1_joint_train
  run_name: canos_k_steps%k_steps_hd256_lr%lr_w_sg_pbl%w_sg_pbl_task_3_1_joint
  is_debug: false
  seed: 11
  cpu: false
  trainer_name: subgraph_finetune_trainer
  # val_loss's subproblem_consistency entry (below) only actually runs on
  # this val dataset index -- 4 is dataset.datasets[5] (case500, split:
  # val -- the last entry), matching val_num in calc_one_val_error (0-indexed
  # into dataset.datasets[1:]: 0=case14, 1=case30, 2=case57, 3=case118,
  # 4=case500). It doesn't make sense to cut a subgraph out of
  # case14/30/57/118 and compare it against ITS OWN full-grid prediction the
  # way it does for case500 (the source grid these subgraphs are meant to
  # approximate) -- see SubgraphFinetuneTrainer.calc_one_val_error.
  consistency_val_indices: [4]
model:
  dataset: _include_
  hidden_dim: 256  # fixed (not swept) -- matches the checkpoint
  include_sent_messages: true
  k_steps: _manual_list(15, 20 | 15, 20)      # canos_task_3_1_finetune.yaml warm-starts from, so the
                    # two configs are directly comparable. No pretrained_path
                    # here -- trains from GNNTrainer's normal (random) init.
  name: canos_pf
optim:
  # From-scratch training regime, copied from canos_task_1_3.yaml -- NOT
  # the finetune config's short/low-lr/no-warmup settings, which assume an
  # already-converged starting point that doesn't exist here.
  lr_scheduler:
    milestones:
    - 5
    name: SequentialLR
    schedulers:
    - end_factor: 1
      name: LinearLR
      start_factor: 0.01
    - gamma: 0.9
      name: StepLR
      step_size: 4
  optimizer:
    lr: _manual_list(0.001, 0.0003 | 1e-3, 3e-4)
    name: Adam
    weight_decay: 0.0
  train_params:
    batch_size: 64
    epochs: 200  # full from-scratch budget (vs. the finetune config's 80),
                 # matching canos_task_1_3.yaml
    train_loss:
    # Flat N-way combined_loss: total = 1.0*PBL + w2*consistency + w3*subgraph
    # power-balance (universal_power_balance's weight is fixed at 1 by simply
    # not tuning it -- weight defaults to 1 when omitted).
    - name: combined_loss
      profile: true
      losses:
      - name: universal_power_balance
        inputs:
          model: CANOS
      - name: subproblem_consistency
        # w2: weight of the consistency term. Tied to its own "consw" connect
        # key (distinct from "sgband" below and "pblw" on w3) so it sweeps
        # independently -- cross-producted with sgband (3) and pblw (2) below
        # for 3*2*2=12 total jobs. consistency_weight_label is a decoy:
        # CombinedLoss only reads name/weight/inputs from each losses[] entry
        # and ignores anything else, so this extra key is free to carry a
        # SEPARATE %consistency_weight_label run_name placeholder -- %weight
        # alone would be ambiguous since w3 below also uses the literal key
        # name "weight", and a bare string .replace() can't tell them apart
        # (both %weight occurrences in run_name would get overwritten by
        # whichever sweep's substitution runs first, silently hiding the
        # other). The decoy's own key must be UNIQUE too -- naming both
        # decoys "weight_label" would hit this exact same collision again.
        weight: 0 # _connected_list(consw -- 0.01, 0.1 | 0.01, 0.1)
        w_sg_cons: 0 #_connected_list(consw -- 0.01, 0.1 | 0.01, 0.1)
        inputs:
          # min_size/max_size vary together (paired, not cross-producted) across
          # three size bands -- two tight ones (case30, case118), plus a "wide"
          # band spanning that whole range to test whether training on diverse
          # subgraph sizes transfers better overall than specializing to one
          # target size. Shares the "sgband" key with case_name/use_first_only
          # above and below (must all stay the same length).
          min_size: _connected_list(sgband -- 10 | wide)
          max_size: _connected_list(sgband -- 125 | wide)
          # 4 independent subgraph draws per case500 sample per step (own
          # seed bus/BFS growth each -- see build_subproblem_batch), instead
          # of just 1. Fixed here, not swept -- change to a
          # _connected_list(...) tied to a new key if you want to sweep it
          # later. voltage_loss/injection_loss/edge_loss/subgraph PBL are
          # all pooled per-subgraph before being averaged (see
          # custom_losses._per_subgraph_mse and PowerBalanceLoss's own
          # aggregation), so a sample doesn't get 4x the gradient weight
          # just because it contributed 4 subgraphs.
          subgraphs_per_sample: 4
          detach_teacher: true  # stop-gradient "teacher" (full-grid) pass; set
                                 # false for symmetric/joint gradients instead
          voltage_weight: 1.0
          injection_weight: 1.0
          edge_weight: 1.0
          # pbl_weight left at its default (0.0): the subgraph power-balance
          # term is its OWN independently-weighted component below (a
          # recycle_loss reusing this same subgraph/second forward pass, no
          # extra cost), not folded into this consistency subtotal --
          # setting this nonzero here too would double-count it.
          profile: true
      - name: recycle_loss  # pulls subproblem_consistency.pbl_loss, computed just above
        # w3: weight of the subgraph power-balance term. Own "pblw" connect
        # key, independent of consw/sgband -- see the comment on w2 above for
        # why subgraph_pbl_weight_label (a second, identically-swept, but
        # UNIQUELY NAMED key) exists at all.
        weight: _connected_list(pblw -- 1, 10 | 1, 10)
        w_sg_pbl: _connected_list(pblw -- 1, 10 | 1, 10)
        inputs:
          recycled_parameter: pbl_loss
          loss_name: "Subgraph power balance"
          keyword: finetune_subgraph_pbl
    # Logged only (see SubgraphFinetuneTrainer._wire_recycle_losses) -- pulls
    # the already-computed subtotals off train_loss[0] above for free, no
    # extra forward pass, so train.json shows all three components
    # separately alongside the combined total (train_loss[0] itself) that
    # actually gets backpropagated.
    - name: recycle_loss
      recycled_parameter: power_balance_mean
      loss_name: "Universal power balance subtotal (PBL Mean, unweighted)"
      keyword: finetune_supervised
    - name: recycle_loss
      recycled_parameter: loss
      loss_name: "Consistency subtotal (subproblem_consistency, unweighted)"
      keyword: finetune_consistency
    - name: recycle_loss
      recycled_parameter: pbl_loss
      loss_name: "Subgraph power balance subtotal (unweighted)"
      keyword: finetune_subgraph_pbl
    - lamb: 0.1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
  val_params:
    batch_size: 64
    # Re-enabled (commented out in the finetune config, since an 80-epoch
    # finetune from an already-good checkpoint doesn't need it) -- a
    # 200-epoch from-scratch run does, matching canos_task_1_3.yaml.
    report_every: 1
    val_loss:
    - model: CANOS
      name: universal_power_balance
    - lamb: 0.1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
    # Only actually evaluated on val dataset index 4 (case500) -- see
    # functional.consistency_val_indices above; a NaN-returning stand-in
    # runs in its place for case14/30/57/118 (no subgraph gets built for
    # them). min_size/max_size/subgraphs_per_sample reuse the exact same
    # sgband-tagged values as train_loss[0]'s subproblem_consistency
    # component above, so each job evaluates consistency at whatever size
    # band/subgraph count it's actually training at.
    - name: subproblem_consistency
      min_size: _connected_list(sgband -- 10 | wide)
      max_size: _connected_list(sgband -- 125 | wide)
      subgraphs_per_sample: 4
      detach_teacher: true
      voltage_weight: 1.0
      injection_weight: 1.0
      edge_weight: 1.0
      # pbl_weight left at its default (0.0): the subgraph power-balance
      # residual is reported as its OWN separate val_loss entry below
      # (recycle_loss, reads .pbl_loss -- still computed every call
      # regardless of pbl_weight, just not folded into this entry's own
      # .loss/reported number when pbl_weight is 0) instead of being folded
      # into this one, so the two show up as distinct numbers in val.json.
    # Logged only -- pulls the subgraph PBL subtotal off the
    # subproblem_consistency entry just above for free (see
    # SubgraphFinetuneTrainer._wire_recycle_losses, which wires a
    # recycle_loss found in val_loss to val_loss's OWN subproblem_
    # consistency instance, not train's -- they're separate objects). Only
    # meaningful on val dataset index 4, same as the entry above --
    # calc_one_val_error's swap also catches this entry specifically
    # (not just the subproblem_consistency entry itself) and replaces it
    # with the same NaN stand-in for every other val dataset, since
    # otherwise it would read whatever .pbl_loss was left over on the
    # shared instance from the last time consistency actually ran (case500,
    # possibly a previous epoch) rather than something meaningful to
    # case14/30/57/118.
    - name: recycle_loss
      recycled_parameter: pbl_loss
      loss_name: "Subgraph power balance subtotal (unweighted)"
      keyword: finetune_subgraph_pbl
