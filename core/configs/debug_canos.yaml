config_type: experiment
dataset:
  datasets:
  - add_bus_type: true
    case_name: case500
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: train
    task: 1.3
  - add_bus_type: true
    case_name: case14
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
  - add_bus_type: true
    case_name: case30
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
  - add_bus_type: true
    case_name: case57
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
  - add_bus_type: true
    case_name: case118
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
  - add_bus_type: true
    case_name: case500
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
functional:
  # checkpoint: True
  # run_location: canos_case500_hyperparam
  # run_name: canos_k_steps%k_steps_hd%hidden_dim_lr%lr
  is_debug: true
  seed: 11
  cpu: false
  trainer_name: gnn_trainer
model:
  dataset: _include_
  hidden_dim: 128
  include_sent_messages: true
  k_steps: 15
  name: canos_pf
optim:
  lr_scheduler:
    milestones:
    - 5
    name: SequentialLR
    schedulers:
    - end_factor: 1
      name: LinearLR
      start_factor: 0.01
    - gamma: 0.9
      name: StepLR
      step_size: 4
  optimizer:
    lr: 0.0005
    name: Adam
    weight_decay: 0.0
  train_params:
    batch_size: 64
    epochs: 200
    train_loss:
    - model: CANOS
      name: universal_power_balance
    - lamb: 0.1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
  val_params:
    batch_size: 64
    early_stop:
      decrease_by: 0.01
      decrease_for: 20
      needs_best_every: 30
    report_every: 2
    val_loss:
    - model: CANOS
      name: universal_power_balance
    - lamb: 0.1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss

