config_type: simple_batch
job_parameters:
  # SLURM has no "either GPU type" flag: --gres is an AND list (comma means
  # "give me all of these"), and --constraint only matches node Features,
  # not Gres types (hence "Invalid feature specification" -- l40s/h200 are
  # registered as Gres here, not Features). Tied to the same "sgband" key as
  # min_size/max_size/case_name/use_first_only below (not a separate key --
  # that would cross-product into more jobs, not just route the existing
  # ones) so each of the 10 jobs (5 bands x 2 lamb) gets routed to one pool,
  # no duplication: 14/30/57 -> l40s, 118/wide -> h200.
  p: _connected_list(sgband -- mit_normal_gpu, mit_preemptable, mit_preemptable, pi_donti_gpu, pi_donti_gpu | l40s, l40s, l40s, h200, h200)
  gres: _connected_list(sgband -- gpu:l40s:1, gpu:l40s:1, gpu:l40s:1, gpu:h200:1, gpu:h200:1 | l40s, l40s, l40s, h200, h200)
  requeue: __novalue__
  body: "source ~/.bashrc\nconda activate pfdelta2\nexec __launch__"
  mem: 64G
  output: canos_hyperparam_finetune_%j.out
  signal: USR1@90
  time: "05:59:00"
# Subgraph-consistency finetuning for topology transfer (PFDelta task 3.1).
#
# Scenario: CANOS trained on case500 (e.g. via canos_task_1_3.yaml with
# case_name: case500) generalizes poorly to case118. This does NOT train on
# any case118 data -- it warm-starts from that case500 checkpoint and keeps
# training on case500's own train split, with one addition: alongside
# universal_power_balance (the same objective canos_task_1_3.yaml actually
# backpropagates -- see its train_loss[0]; canos_pf_mse/pf_constraint_
# violation are logged there, not optimized), a self-consistency
# term from core/utils/custom_losses.py::SubproblemConsistencyLoss samples
# ~118-bus subgraphs out of the (much bigger) case500 grid, folds the cut
# tie-lines' predicted flows into the boundary buses as extra injection,
# solves the subgraph, and penalizes disagreement with the full case500
# prediction -- teaching the model to be self-consistent at ~case118 scale
# using only case500 data. See core/utils/create_subproblem.py for the
# mechanics.
#
# case118 only appears below as a validation set, purely to monitor whether
# this is actually closing the transfer gap -- val_loss is never
# backpropagated (see GNNTrainer: only train_loss[0] gets .backward()).
dataset:
  datasets:
  - add_bus_type: true
    case_name: case500  # the only source of training data (source case)
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: train
    task: 1.3
  - add_bus_type: true
    # First-listed val dataset -- this is the one early_stop_now/is_new_best
    # actually use (see val_params.use_first_only below and
    # BaseTrainer.interpret_val_performance), so tying its case to the same
    # sgband key as min_size/max_size makes early stopping/best-model
    # selection follow whichever case matches each job's size band. The
    # "wide" band doesn't target one case, so it repeats case118 here --
    # doesn't matter which, since use_first_only=false for that band means
    # this entry is just averaged in with everyone else, not singled out.
    case_name: _connected_list(sgband -- case14, case30, case57, case118, case118 | 14, 30, 57, 118, wide)
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
  - add_bus_type: true
    case_name: case14
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
  - add_bus_type: true
    case_name: case30
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
  - add_bus_type: true
    case_name: case57
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
  - add_bus_type: true
    case_name: case118
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
  - add_bus_type: true
    case_name: case500
    model: CANOS
    name: pfdeltaCANOS
    root_dir: /orcd/pool/005/donti_shared/pfdelta_data
    split: val
    task: 1.3
functional:
  run_location: canos_task_3_1_finetune
  run_name: canos_k_steps15_hd256_lr1e-4_sgband_%min_size_cons_lam_%lamb_gpu%p_task_3_1_finetune
  is_debug: false
  seed: 11
  cpu: false
  trainer_name: subgraph_finetune_trainer
model:
  dataset: _include_
  hidden_dim: 256
  include_sent_messages: true
  k_steps: 15
  name: canos_pf
  pretrained_path: runs/canos_case500_hyperparam_later_stop/canos_k_steps15_hd256_lr1e-3_5_260824_183432/model.pt
optim:
  optimizer:
    lr: 0.0001
    name: Adam
    weight_decay: 0.0
  train_params:
    batch_size: 64
    epochs: 30
    train_loss:
    - name: combined_loss
      loss1: universal_power_balance
      inp1:
        model: CANOS
      loss2: subproblem_consistency
      inp2:
        # min_size/max_size vary together (paired, not cross-producted) across
        # five size bands -- four tight ones roughly matching case14/case30/
        # case57/case118, plus a "wide" band spanning that whole range (case14
        # through case118) to test whether training on diverse subgraph sizes
        # transfers better overall than specializing to one target size. 5
        # runs from this pair (not 25), since they share the "sgband" key.
        min_size: _connected_list(sgband -- 10, 24, 48, 100, 10 | 14, 30, 57, 118, wide)
        max_size: _connected_list(sgband -- 18, 36, 66, 136, 136 | 14, 30, 57, 118, wide)
        detach_teacher: true  # stop-gradient "teacher" (full-grid) pass; set
                               # false for symmetric/joint gradients instead
        voltage_weight: 1.0
        injection_weight: 1.0
        edge_weight: 1.0
      lamb: _manual_list(0.01, 0.1 | 0.01, 0.1)  # weight of the consistency term relative to the supervised one
    # Logged only (see SubgraphFinetuneTrainer._wire_recycle_losses) -- pulls
    # the already-computed subtotals off train_loss[0] above for free, no
    # extra forward pass, so train.json shows both components alongside the
    # combined total (train_loss[0]'s own entry, named "PBL Mean+Subproblem
    # consistency") that actually gets backpropagated.
    - name: recycle_loss
      recycled_parameter: power_balance_mean
      loss_name: "Universal power balance subtotal (PBL Mean, unweighted)"
      keyword: finetune_supervised
    - name: recycle_loss
      recycled_parameter: loss
      loss_name: "Consistency subtotal (subproblem_consistency, unweighted)"
      keyword: finetune_consistency
    - lamb: 0.1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
  val_params:
    batch_size: 64
    # True (the 4 targeted bands): early stopping/best-model follows only the
    # first-listed val dataset (dataset.datasets[1], tied to case_name above).
    # False (the "wide" band): no single target case makes sense, so it
    # averages the leading val_loss (PBL Mean) across ALL val datasets
    # instead (see BaseTrainer.interpret_val_performance).
    use_first_only: _connected_list(sgband -- true, true, true, true, false | 14, 30, 57, 118, wide)
    early_stop:
      decrease_by: 0.01
      decrease_for: 20
      needs_best_every: 30
    report_every: 1
    val_loss:
    - model: CANOS
      name: universal_power_balance
    - lamb: 0.1
      loss1: canos_pf_mse
      loss2: pf_constraint_violation
      name: combined_loss
